name: Secrets Scan Test

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DevSec Secrets Scanner
        uses: senulahesara/devsec-secrets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # ✅ REQUIRED: gives the action permission to call GitHub API
          skip_label: gg-scan-skip                    # optional, can remove if not using skip labels
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
